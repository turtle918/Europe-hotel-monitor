name: Weekly Hotel and Flight Scraper

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==================== Job 1: 酒店爬虫 ====================
  scrape-hotels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright playwright-stealth
          playwright install chromium --with-deps

      - name: Run hotel scraper
        run: |
          sed -i 's/headless: bool = False/headless: bool = True/' config.py
          python booking_scraper.py

      - name: Upload hotel database
        uses: actions/upload-artifact@v4
        with:
          name: hotel-db
          path: booking_data.db

  # ==================== Job 2: 机票爬虫 ====================
  scrape-flights:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install chromium --with-deps

      - name: Run flight scraper
        run: |
          sed -i 's/headless: bool = False/headless: bool = True/' config.py
          python flight_scraper.py

      - name: Upload flight database
        uses: actions/upload-artifact@v4
        with:
          name: flight-db
          path: booking_data.db

  # ==================== Job 3: 合并 & 提交 ====================
  merge-and-commit:
    needs: [scrape-hotels, scrape-flights]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download hotel database
        uses: actions/download-artifact@v4
        with:
          name: hotel-db

      - name: Download flight database
        uses: actions/download-artifact@v4
        with:
          name: flight-db
          path: flight-db

      - name: Merge databases
        run: |
          sqlite3 booking_data.db "ATTACH DATABASE 'flight-db/booking_data.db' AS flight_db; INSERT OR IGNORE INTO flights SELECT * FROM flight_db.flights;"

      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Commit and push changes
        run: |
          git add booking_data.db
          git diff --staged --quiet || git commit -m "chore: update hotel and flight data [skip ci]"
          git push
