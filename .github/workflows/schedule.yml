name: Weekly Hotel and Flight Scraper

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright playwright-stealth
          playwright install chromium --with-deps

      - name: Run scrapers
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          sed -i 's/headless: bool = False/headless: bool = True/' config.py
          python booking_scraper.py
          python flight_scraper.py
          python ai_evaluator.py

      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Commit and push changes
        run: |
          git add booking_data.db booking_results.csv
          git diff --staged --quiet || git commit -m "chore: update hotel and flight data [skip ci]"
          git push
